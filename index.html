<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traza Labels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f4ef;
    --panel: #ffffff;
    --ink: #22201c;
    --muted: #6d675d;
    --line: #e2ddd2;
    --accent: #6b4f2a;
    --accent-ink: #ffffff;
    --danger: #a3362b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Montserrat", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 7px 12px; font: inherit; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  main { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; gap: 20px; padding: 20px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 16px; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card + .card { margin-top: 16px; }
  .card h2 { font-size: 14px; margin: 0 0 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  label.f { display: block; margin-bottom: 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
  label.f input, label.f textarea {
    display: block; width: 100%; margin-top: 4px; padding: 8px 10px; font: inherit; font-size: 14px; font-weight: 400;
    color: var(--ink); border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  label.f textarea { resize: vertical; min-height: 60px; }
  label.f textarea.short { min-height: 0; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { font-weight: 400; color: var(--muted); font-size: 11px; }
  .qr-in { display: flex; gap: 10px; align-items: flex-start; }
  .qr-in textarea { min-height: 72px; font-family: ui-monospace, monospace; font-size: 11px !important; }
  .qr-thumb { width: 72px; height: 72px; flex: none; border: 1px dashed var(--line); border-radius: 6px; object-fit: contain; background: #fff; }
  .btn {
    border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 8px 14px; border-radius: 8px;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .err { color: var(--danger); font-size: 12px; min-height: 16px; margin-top: 6px; }
  .traces { list-style: none; margin: 0; padding: 0; }
  .traces li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .traces li:first-child { border-top: 0; }
  .traces img { width: 36px; height: 36px; }
  .traces .t { flex: 1; min-width: 0; }
  .traces .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .traces .t span { color: var(--muted); font-size: 12px; }
  .traces li.editing { background: #faf6ee; }
  .empty { color: var(--muted); font-size: 13px; }
  .summary { color: var(--muted); font-size: 13px; }
  .preview { min-width: 0; }
  .sheets { display: flex; flex-direction: column; gap: 20px; align-items: center; }
  .sheets canvas { display: block; width: 100%; max-width: 816px; aspect-ratio: 8.5 / 11; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.12); }

  @page { size: letter; margin: 0; }
  @media print {
    body { background: #fff; }
    header, .panel, .summary { display: none !important; }
    main { display: block; padding: 0; }
    .sheets { gap: 0; }
    .sheets canvas { width: 8.5in; height: 11in; max-width: none; box-shadow: none; break-after: page; }
  }
</style>
</head>
<body>
<header>
  <h1>Traza Labels</h1>
  <div class="toolbar">
    <div class="seg" role="group" aria-label="Label language">
      <button type="button" data-lang="es" class="on">Español</button>
      <button type="button" data-lang="en">English</button>
    </div>
    <button type="button" class="btn primary" id="export" disabled>Export PDF</button>
  </div>
</header>

<main>
  <section class="panel">
    <form class="card" id="form" autocomplete="off">
      <h2 id="form-title">New trace</h2>
      <div class="row">
        <label class="f">Reference number<input name="ref" required></label>
        <label class="f">Labels<input name="qty" type="number" min="1" step="1" value="14" required></label>
      </div>
      <label class="f">Product name <span class="hint">NOMBRE PRODUCTO</span><input name="product" required placeholder="Chiroso"></label>
      <label class="f">Address <span class="hint">DIRECCION, with province; line breaks become commas</span><textarea class="short" name="address" rows="2" required placeholder="Santa Bárbara, Antioquia"></textarea></label>
      <label class="f">Process<input name="process" required placeholder="100% Lavado Terroir"></label>
      <label class="f">Tasting notes<textarea name="notes" required placeholder="Notas a chocolate, durazno, piña…"></textarea></label>
      <label class="f">Facility line <span class="hint">optional, printed as typed</span><textarea name="facility" placeholder="Tostado y Envasado por … NSA-…"></textarea></label>
      <label class="f">QR code <span class="hint">paste qr_binary, or upload a PNG</span>
        <span class="qr-in">
          <textarea name="qr" placeholder="data:image/png;base64,…"></textarea>
          <img class="qr-thumb" id="qr-thumb" alt="">
        </span>
      </label>
      <input type="file" id="qr-file" accept="image/png,image/jpeg">
      <div class="err" id="err"></div>
      <div class="actions">
        <button class="btn primary" id="save" type="submit">Add trace</button>
        <button class="btn" id="cancel" type="button" hidden>Cancel</button>
      </div>
    </form>

    <div class="card">
      <h2>Traces</h2>
      <ul class="traces" id="traces"></ul>
      <p class="empty" id="empty">No traces yet. Add one above. Traces stay until the page is reloaded.</p>
    </div>

    <div class="card">
      <h2>Watermark</h2>
      <p class="summary" style="margin-top:0" id="wm-status"></p>
      <input type="file" id="wm-file" accept="image/png,image/jpeg">
    </div>
  </section>

  <section class="preview">
    <p class="summary" id="summary"></p>
    <div class="sheets" id="sheets"></div>
  </section>
</main>

<script>
// 96 x 384 px PNG, relative to this page. Point it at the file uploaded to GitHub Pages.
const WATERMARK_URL = "watermark.png";

const TEXT = {
  es: {
    msg: "Sigue las huellas de nuestro café, vive una experiencia de sabor única",
    process: "Proceso:",
    fixed: "100% Café Arábica. Fabricado por Velvet Greens SAS.",
  },
  en: {
    msg: "Follow the footprints of our coffee, live a unique flavor experience",
    process: "Process:",
    fixed: "100% Arabica coffee. Made by Velvet Greens SAS.",
  },
};

// All geometry is in CSS px at 96 px per inch: a label is 1 x 5 in, a sheet is US Letter.
const PAGE = { w: 816, h: 1056 };
const LABEL = { w: 96, h: 480 };
const COLS = 7, ROWS = 2, PER_SHEET = COLS * ROWS;
const GRID = { x: (PAGE.w - COLS * LABEL.w) / 2, y: (PAGE.h - ROWS * LABEL.h) / 2 };
const PREVIEW_SCALE = 2;
const PDF_SCALE = 4; // 384 dpi

const FONT = "Montserrat, sans-serif";
const INK = "#3b3833";
const NAME_INK = "#2a2722";

const state = { lang: "es", traces: [], editing: null, watermark: null, nextId: 1 };

const $ = (s) => document.querySelector(s);
const form = $("#form");
const qrField = form.elements.qr;

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("not an image"));
    img.src = src;
  });
}

function readFile(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// ---------- QR input ----------
function normalizeQr(raw) {
  const v = (raw || "").trim().replace(/\s+/g, "");
  if (!v) return "";
  if (v.startsWith("data:image/")) return v;
  if (/^[A-Za-z0-9+/=]+$/.test(v)) return "data:image/png;base64," + v;
  return null;
}

async function refreshThumb() {
  const thumb = $("#qr-thumb");
  const src = normalizeQr(qrField.value);
  if (!src) { thumb.removeAttribute("src"); return; }
  try { await loadImage(src); thumb.src = src; } catch { thumb.removeAttribute("src"); }
}
qrField.addEventListener("input", refreshThumb);
$("#qr-file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  qrField.value = await readFile(f);
  e.target.value = "";
  refreshThumb();
});

// ---------- Form ----------
function resetForm() {
  form.reset();
  state.editing = null;
  $("#form-title").textContent = "New trace";
  $("#save").textContent = "Add trace";
  $("#cancel").hidden = true;
  $("#err").textContent = "";
  refreshThumb();
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const el = form.elements;
  const err = $("#err");
  const src = normalizeQr(el.qr.value);
  if (!src) { err.textContent = "Paste the qr_binary value or upload a QR image."; return; }
  let qrImg;
  try { qrImg = await loadImage(src); } catch { err.textContent = "The QR value is not a readable image."; return; }
  const qty = parseInt(el.qty.value, 10);
  if (!(qty >= 1)) { err.textContent = "Labels must be 1 or more."; return; }

  const data = {
    ref: el.ref.value.trim(),
    product: el.product.value.trim(),
    address: el.address.value.trim().split(/\s*\n\s*/).filter(Boolean).join(", "),
    process: el.process.value.trim(),
    notes: el.notes.value.trim(),
    facility: el.facility.value.trim(),
    qr: src,
    qrImg,
    qty,
  };
  if (state.editing) {
    Object.assign(state.traces.find((t) => t.id === state.editing), data);
  } else {
    state.traces.push({ id: state.nextId++, ...data });
  }
  resetForm();
  render();
});

$("#cancel").addEventListener("click", () => { resetForm(); renderList(); });

function editTrace(id) {
  const t = state.traces.find((x) => x.id === id);
  const el = form.elements;
  for (const k of ["ref", "qty", "product", "address", "process", "notes", "facility", "qr"]) el[k].value = t[k];
  state.editing = id;
  $("#form-title").textContent = "Edit trace";
  $("#save").textContent = "Save changes";
  $("#cancel").hidden = false;
  $("#err").textContent = "";
  refreshThumb();
  renderList();
  form.scrollIntoView({ behavior: "smooth", block: "start" });
}

function deleteTrace(id) {
  const t = state.traces.find((x) => x.id === id);
  if (!confirm(`Delete trace ${t.ref}?`)) return;
  state.traces = state.traces.filter((x) => x.id !== id);
  if (state.editing === id) resetForm();
  render();
}

// ---------- Watermark ----------
async function setWatermark(src, label) {
  try {
    state.watermark = await loadImage(src);
    $("#wm-status").textContent = `Using ${label}. Upload a file to replace it for this session.`;
  } catch {
    state.watermark = null;
    $("#wm-status").textContent = `Could not load ${label}; labels print without a watermark. Upload a file to use one.`;
  }
  renderPreview();
}
$("#wm-file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (f) setWatermark(await readFile(f), f.name);
});

// ---------- Language ----------
document.querySelectorAll("[data-lang]").forEach((b) =>
  b.addEventListener("click", () => {
    state.lang = b.dataset.lang;
    document.querySelectorAll("[data-lang]").forEach((x) => x.classList.toggle("on", x === b));
    renderPreview();
  })
);

// ---------- Drawing ----------
function wrap(ctx, text, maxWidth) {
  const lines = [];
  let line = "";
  for (const word of text.split(/\s+/).filter(Boolean)) {
    const next = line ? line + " " + word : word;
    if (ctx.measureText(next).width <= maxWidth) { line = next; continue; }
    if (line) lines.push(line);
    line = word;
    // A single word wider than the line is broken by characters.
    while (ctx.measureText(line).width > maxWidth && line.length > 1) {
      let i = line.length - 1;
      while (i > 1 && ctx.measureText(line.slice(0, i)).width > maxWidth) i--;
      lines.push(line.slice(0, i));
      line = line.slice(i);
    }
  }
  if (line) lines.push(line);
  return lines;
}

// Text block, in the rotated frame: 384 wide (bottom to top of the label) by 96 tall.
const TXT = { w: 384, h: 96, padL: 12, padR: 10, padT: 6, padB: 6 };

function layoutText(ctx, t, s) {
  const L = TEXT[state.lang];
  const width = TXT.w - TXT.padL - TXT.padR;
  const block = (parts) => parts.flatMap(([text, size, weight, color]) => {
    ctx.font = `${weight} ${size * s}px ${FONT}`;
    return wrap(ctx, text, width).map((line) => ({ line, font: ctx.font, size: size * s, color }));
  });
  const top = block([
    [L.msg, 6.6, 400, INK],
    [`${t.product} - ${t.address}`, 7.6, 700, NAME_INK],
    [`${L.process} ${t.process}`, 6.8, 600, INK],
  ]);
  const bottom = block([
    [t.notes, 5.6, 400, INK],
    [L.fixed, 5.6, 400, INK],
    ...(t.facility ? [[t.facility, 5.6, 400, INK]] : []),
  ]);
  const height = (lines) => lines.reduce((h, l) => h + l.size * 1.3, 0);
  return { top, bottom, fits: height(top) + height(bottom) + 3 <= TXT.h - TXT.padT - TXT.padB, height };
}

function drawLabel(ctx, t, x, y, guides) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.rect(0, 0, LABEL.w, LABEL.h);
  ctx.clip();
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, LABEL.w, LABEL.h);
  if (state.watermark) ctx.drawImage(state.watermark, 0, 96, 96, 384);

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(t.qrImg, 14, 6, 68, 68);
  ctx.imageSmoothingEnabled = true;

  ctx.fillStyle = "#55504a";
  ctx.font = `400 10px ${FONT}`;
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0.8px";
  ctx.fillText(t.ref, LABEL.w / 2, 87);
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";

  // Shrink the text until both groups fit, then put one group at each long edge.
  let s = 1, lay = layoutText(ctx, t, s);
  while (!lay.fits && s > 0.55) { s -= 0.03; lay = layoutText(ctx, t, s); }

  ctx.translate(0, LABEL.h);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  let cy = TXT.padT;
  for (const l of lay.top) {
    cy += l.size * 1.3;
    ctx.font = l.font; ctx.fillStyle = l.color;
    ctx.fillText(l.line, TXT.padL, cy - l.size * 0.3);
  }
  cy = TXT.h - TXT.padB - lay.height(lay.bottom);
  for (const l of lay.bottom) {
    cy += l.size * 1.3;
    ctx.font = l.font; ctx.fillStyle = l.color;
    ctx.fillText(l.line, TXT.padL, cy - l.size * 0.3);
  }
  ctx.restore();

  if (guides) {
    ctx.save();
    ctx.strokeStyle = "#d6d0c4";
    ctx.lineWidth = 0.5;
    ctx.setLineDash([3, 3]);
    ctx.strokeRect(x + 0.25, y + 0.25, LABEL.w - 0.5, LABEL.h - 0.5);
    ctx.restore();
  }
}

function drawSheet(labels, scale, guides) {
  const canvas = document.createElement("canvas");
  canvas.width = PAGE.w * scale;
  canvas.height = PAGE.h * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, PAGE.w, PAGE.h);
  labels.forEach((t, i) =>
    drawLabel(ctx, t, GRID.x + (i % COLS) * LABEL.w, GRID.y + Math.floor(i / COLS) * LABEL.h, guides)
  );
  return canvas;
}

function pages() {
  const labels = state.traces.flatMap((t) => Array(t.qty).fill(t));
  const out = [];
  for (let i = 0; i < labels.length; i += PER_SHEET) out.push(labels.slice(i, i + PER_SHEET));
  return out;
}

const fontsReady = Promise.all([400, 600, 700].map((w) => document.fonts.load(`${w} 10px Montserrat`))).catch(() => {});

// ---------- Rendering ----------
async function renderPreview() {
  await fontsReady;
  const holder = $("#sheets");
  const ps = pages();
  holder.replaceChildren(...ps.map((p) => drawSheet(p, PREVIEW_SCALE, true)));

  const total = state.traces.reduce((n, t) => n + t.qty, 0);
  const empty = total % PER_SHEET ? PER_SHEET - (total % PER_SHEET) : 0;
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  $("#summary").textContent = total
    ? `${plural(total, "label")} · ${plural(ps.length, "US Letter page")}` +
      (empty ? ` · ${plural(empty, "empty spot")} on the last page` : "")
    : "Add a trace to see the sheet preview.";
  $("#export").disabled = !total;
}

function node(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function renderList() {
  const ul = $("#traces");
  ul.replaceChildren();
  $("#empty").hidden = state.traces.length > 0;
  state.traces.forEach((t) => {
    const li = node("li");
    if (state.editing === t.id) li.className = "editing";
    const img = node("img");
    img.src = t.qr;
    img.alt = "";
    const info = node("div", "t");
    info.append(
      node("b", null, `${t.product} - ${t.address}`),
      node("span", null, `Ref ${t.ref} · ${t.qty} label${t.qty === 1 ? "" : "s"}`)
    );
    const edit = node("button", "btn small", "Edit");
    edit.type = "button";
    edit.onclick = () => editTrace(t.id);
    const del = node("button", "btn small danger", "Delete");
    del.type = "button";
    del.onclick = () => deleteTrace(t.id);
    li.append(img, info, edit, del);
    ul.append(li);
  });
}

function render() { renderList(); renderPreview(); }

// ---------- PDF ----------
$("#export").addEventListener("click", async () => {
  const btn = $("#export");
  btn.disabled = true;
  btn.textContent = "Building PDF…";
  try {
    await fontsReady;
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: "in", format: "letter", orientation: "portrait" });
    pages().forEach((p, i) => {
      if (i > 0) pdf.addPage("letter", "portrait");
      pdf.addImage(drawSheet(p, PDF_SCALE, false).toDataURL("image/png"), "PNG", 0, 0, 8.5, 11, undefined, "FAST");
    });
    pdf.save(`traza-labels-${state.lang}.pdf`);
  } catch (e) {
    alert("Could not build the PDF: " + e.message +
      (location.protocol === "file:"
        ? "\n\nOpened as a local file, the browser blocks reading watermark.png. Upload it under Watermark, or open the page from GitHub Pages."
        : ""));
  } finally {
    btn.textContent = "Export PDF";
    btn.disabled = !state.traces.length;
  }
});

setWatermark(WATERMARK_URL, WATERMARK_URL);
render();
</script>
</body>
</html>
